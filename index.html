<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEC Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .portfolio-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 1200px;
    }

    .portfolio-page {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      background-color: #1e293b; /* Placeholder color before image paints */
    }
  </style>
</head>
<body>

  <main class="portfolio-container" id="portfolio">
    <!-- Page 1 is eager-loaded with high priority for instant LCP paint -->
    <img
      src="images/1.jpg"
      alt="AEC Portfolio Page 1"
      class="portfolio-page"
      loading="eager"
      fetchpriority="high"
    >
  </main>

  <script>
    const TOTAL_PAGES = 48;
    const container = document.getElementById('portfolio');

    // Dynamically append the remaining pages with native lazy-loading
    for (let i = 2; i <= TOTAL_PAGES; i++) {
      const img = document.createElement('img');
      img.src = `images/${i}.jpg`;
      img.alt = `AEC Portfolio Page ${i}`;
      img.className = 'portfolio-page';
      img.loading = 'lazy';
      img.decoding = 'async';

      // Automatically stop rendering if a page index doesn't exist
      img.onerror = function() {
        this.remove();
      };

      container.appendChild(img);
    }
  </script>

</body>
</html>
